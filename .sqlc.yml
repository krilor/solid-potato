---
version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/potato/"
    queries: "db/queries.sql"
    gen:
      go:
        package: "db"
        out: "db"
        sql_package: "pgx/v5"
        emit_interface: true
        emit_json_tags: true
        emit_db_tags: false
        emit_empty_slices: true
