---
# secretlint-disable
name: potato
services:
  db:
    image: postgres:18
    expose:
      - "5432"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_pwd
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_DB: potato
    volumes:
      - type: bind
        source: ${PWD}/local/db/init.sql
        target: /docker-entrypoint-initdb.d/init.sql
